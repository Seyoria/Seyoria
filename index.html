  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --edge:rgba(255,255,255,.14);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans)}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;background:#fff;filter:blur(110px);opacity:.14;animation:float 30s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-14vmax}
.orbs i:nth-child(2){width:34vmax;height:34vmax;right:-8vmax;top:30vh;opacity:.1;animation-duration:38s}
.orbs i:nth-child(3){width:40vmax;height:40vmax;left:30vw;bottom:-24vmax;opacity:.12;animation-duration:44s}
@keyframes float{to{transform:translate(7vmax,-5vmax) scale(1.2)}}
@media (prefers-reduced-motion:reduce){.orbs i{animation:none}}

main{max-width:1060px;margin:0 auto;padding:40px 20px 60px;display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--edge);border-radius:26px;padding:24px;
  backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.12),transparent 60%)}
.card:hover::after{opacity:1}
h2{font:italic 600 30px/1.1 var(--serif);margin:0 0 16px;letter-spacing:.01em}
svg.i{width:20px;height:20px;flex:none}

.banner{grid-column:1/-1;display:grid;place-items:center;padding:26px 20px;min-height:190px}
.banner img{width:min(420px,78%);height:auto;filter:drop-shadow(0 0 28px rgba(255,255,255,.22))}
.me{grid-column:1/9;grid-row:2/4;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;padding:34px}
.me>*{position:relative;z-index:1}
.avatar{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  font:italic 500 48px var(--serif);background:var(--glass2);border:1px solid var(--edge);box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 0 8px rgba(255,255,255,.06),0 10px 40px rgba(255,255,255,.12)}
.avatar img{width:100%;height:100%;object-fit:cover}
.me h1{font:italic 500 clamp(60px,9vw,104px)/.9 var(--serif);letter-spacing:-.01em;margin:26px 0 12px;text-shadow:0 0 40px rgba(255,255,255,.25)}
.me p{margin:0;color:#cfcfcb;font:italic 500 24px/1.25 var(--serif);max-width:30ch}
.socials{display:flex;gap:10px;margin-top:26px}
.socials a{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);background:var(--glass2);border:1px solid var(--edge);transition:background .2s,transform .2s}
.socials a:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}

.clock{grid-column:9/13;grid-row:2;text-align:center;display:flex;flex-direction:column;justify-content:center}
.clock b{font:500 62px/1 var(--serif);font-variant-numeric:tabular-nums}
.clock span{color:var(--dim);font-size:14px;margin-top:10px}

.disc{grid-column:9/13;grid-row:3;display:flex;align-items:center;gap:14px}
.disc .avatar{width:56px;height:56px;font-size:26px;box-shadow:0 0 0 1px rgba(255,255,255,.3);position:relative;overflow:visible}
.disc .avatar img{border-radius:50%}
.dot{position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:50%;background:#8a8a86;border:3px solid #141414}
.dot.online{background:#4ade80}.dot.idle{background:#facc15}.dot.dnd{background:#f87171}
.disc b{display:block;font-weight:600}.disc small{color:var(--dim);font-size:14px}

.skills{grid-column:1/8}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.tile{aspect-ratio:1;border-radius:18px;background:var(--glass2);border:1px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .2s,background .2s}
.tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.16)}
.tile svg{width:36px;height:36px}

.me>div:first-child{max-width:62%}
.me .projects{position:absolute;inset:0;z-index:0;display:block;color:inherit;text-decoration:none;pointer-events:none}

.projects::before{content:'';position:absolute;top:0;bottom:0;right:0;width:80%;background:linear-gradient(270deg,#000 0%,rgba(0,0,0,.93) 30%,rgba(0,0,0,.55) 62%,transparent 100%)}
.projects img{position:absolute;right:7%;top:50%;transform:translateY(-50%);width:36%;height:auto;filter:drop-shadow(0 0 24px rgba(255,255,255,.2))}

.links{grid-column:8/13}
.gh{grid-column:1/-1}.gh #repos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}.gh .row{margin:0}
.foot{text-align:center;color:var(--dim);font-size:13px;padding:0 20px 40px}
.glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 65%);pointer-events:none;z-index:-1;transition:transform .18s ease-out}
.tile{position:relative}.tile::after{content:attr(data-n);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);padding:5px 10px;border-radius:9px;background:rgba(15,15,15,.94);border:1px solid var(--edge);font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;z-index:3}.tile:hover::after{opacity:1;transform:translate(-50%,0)}
.snowbtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);background:rgba(20,20,20,.7);border:1px solid var(--edge);backdrop-filter:blur(14px);cursor:pointer;z-index:9;transition:opacity .2s,background .2s}.snowbtn:hover{background:rgba(60,60,60,.8)}.snowbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}.snowbtn[aria-pressed=false]{opacity:.45}
@keyframes breathe{50%{filter:drop-shadow(0 0 44px rgba(255,255,255,.42))}}.banner img{animation:breathe 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.banner img{animation:none}}
.disc{background:linear-gradient(120deg,rgba(30,10,18,.92),rgba(96,26,48,.62) 65%,rgba(150,48,82,.45));border-color:rgba(255,140,170,.28);padding:20px 18px}
.disc .blossom{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.disc>*:not(.blossom){position:relative;z-index:1}
.disc .dtxt{min-width:0;flex:1}.disc .dtxt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc .dtxt small{display:flex;align-items:center;gap:6px;color:#d9c9ce;font-size:14px}
.dctl{display:flex;gap:4px;flex:none}.dctl svg{width:26px;height:26px;padding:3px}
.dot{right:-3px;bottom:-3px;width:20px;height:20px;border:3px solid #1d0e14}
.dot.dnd{background:#f23f43}.dot.dnd::after{content:'';position:absolute;left:3px;right:3px;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:#1d0e14}
.disc{background:linear-gradient(120deg,rgba(242,63,67,.14),rgba(255,255,255,.04) 65%);border-color:rgba(242,63,67,.32);padding:22px 20px;gap:16px}
.disc .avatar{width:64px;height:64px}
.disc .dtxt b{font-size:19px}.disc .dtxt .handle{display:block;color:#e8d3da;font-size:13px;margin-top:2px}.disc .dtxt small{margin-top:5px}
.disc .dtxt .state{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:14px;color:#ff8a8d}
.disc .dtxt .state[data-s=online]{color:#4ade80}.disc .dtxt .state[data-s=idle]{color:#facc15}.disc .dtxt .state[data-s=offline]{color:#9a9a96}
.sdot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.me p{min-height:2.5em}
#bio.typing::after{content:'';display:inline-block;width:2px;height:1em;background:var(--ink);margin-left:3px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes reveal{from{opacity:0;filter:blur(14px) drop-shadow(0 0 28px rgba(255,255,255,.22))}to{opacity:1;filter:blur(0) drop-shadow(0 0 28px rgba(255,255,255,.22))}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.banner img{animation:reveal 1.8s ease-out both,breathe 7s 1.8s ease-in-out infinite}
main>.card:not(.banner){animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
main>:nth-child(2){animation-delay:.9s!important}main>:nth-child(3){animation-delay:1.05s!important}main>:nth-child(4){animation-delay:1.2s!important}main>:nth-child(5){animation-delay:1.35s!important}main>:nth-child(6){animation-delay:1.5s!important}
.marquee{overflow:hidden;max-width:1060px;margin:0 auto;padding:6px 0 34px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq{display:flex;width:max-content;animation:mq 46s linear infinite;font:italic 500 clamp(44px,7vw,92px)/1.1 var(--serif);color:transparent;-webkit-text-stroke:1px rgba(244,244,242,.34);white-space:nowrap}
.mq span{padding-right:.5em}@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mq,.banner img,main>.card{animation:none!important}}
#dust{position:fixed;inset:0;z-index:5;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:11px 18px;border-radius:14px;background:rgba(20,20,20,.85);border:1px solid var(--edge);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:.3s;font-size:14px;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:8px;border-radius:16px;background:var(--glass);border:1px solid transparent;color:inherit;text-decoration:none;transition:background .2s,border-color .2s}
.row:last-child{margin-bottom:0}
a.row:hover{background:var(--glass2);border-color:var(--edge)}
a.row:focus-visible,.socials a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row .ic{width:38px;height:38px;border-radius:11px;background:var(--glass2);display:grid;place-items:center;flex:none}
.row div{flex:1;min-width:0}.row span{display:block;font-weight:500}.row small{color:var(--dim);font-size:13px}
.row .go{opacity:.5;width:16px;height:16px}

@media (max-width:900px){main>*{grid-column:1/-1!important;grid-row:auto!important}.me{min-height:0}.me>div:first-child{max-width:none}.me .projects{position:relative;inset:auto;height:120px;margin-top:20px;border-radius:16px;overflow:hidden;background:#000}.projects::before{display:none}.projects img{left:50%;right:auto;width:78%;height:auto;transform:translate(-50%,-50%)}}
</style>
</head>

const $=id=>document.getElementById(id);
function setAvatar(el,src,name){
  const dot=el.querySelector(".dot");
  el.textContent=""; if(src){const im=new Image();im.src=src;im.alt="";el.appendChild(im)}else el.textContent=(name||"?")[0].toUpperCase();
  if(dot)el.appendChild(dot);
}
$("name").textContent=ME.name; $("bio").textContent=ME.bio; $("city").textContent=ME.city;
setAvatar($("avatar"),ME.avatar,ME.name);
const STATE={online:"Çevrimiçi",idle:"Boşta",dnd:"Rahatsız etmeyin",offline:"Çevrimdışı"};
const setState=k=>{$("dot").className="dot "+k;$("dstatus").textContent=STATE[k]||"";$("dstate").dataset.s=k};
$("dname").textContent=ME.discordDisplay;$("dhandle").textContent=ME.discordName;setState(ME.discordState);
setAvatar($("davatar"),ME.avatar,ME.name);
ME.links.filter(l=>l.type!=="mail"||true).forEach(l=>{
  const a=document.createElement("a");a.href=l.url;a.target="_blank";a.rel="noopener";a.title=l.title;a.setAttribute("aria-label",l.title);
  a.innerHTML=ICON[l.type]||ICON.go;$("socials").appendChild(a);
});
ME.skills.forEach(([k,nm])=>{const t=document.createElement("div");t.className="tile";t.dataset.n=nm;t.setAttribute("aria-label",nm);t.innerHTML=LOGO[k]||"";$("skills").appendChild(t)});
function row(icon,main,sub,url){
  const a=document.createElement("a");a.className="row";a.href=url;a.target="_blank";a.rel="noopener";
  a.innerHTML=`<span class="ic">${icon}</span><div><span></span><small></small></div>${ICON.go}`;
  a.querySelector("div span").textContent=main;a.querySelector("small").textContent=sub;return a;
}
ME.links.forEach(l=>$("links").appendChild(row(ICON[l.type]||ICON.go,l.title,l.note,l.url)));
function tick(){const o={timeZone:ME.timezone},d=new Date();let t,ds="",hr;try{t=d.toLocaleTimeString("tr-TR",{...o,hour12:false});ds=d.toLocaleDateString("tr-TR",{...o,weekday:"long",day:"numeric",month:"long"});hr=+d.toLocaleTimeString("en-GB",{...o,hour:"2-digit",hour12:false}).slice(0,2)}catch(e){t=d.toLocaleTimeString("tr-TR",{hour12:false});hr=d.getHours()}
$("time").textContent=t;const g=hr<5?"İyi geceler":hr<12?"Günaydın":hr<18?"İyi günler":hr<22?"İyi akşamlar":"İyi geceler";$("date").textContent=(ds?ds+" · ":"")+g}
tick();setInterval(tick,1000);
document.querySelectorAll(".card").forEach(c=>c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")}));
/* Canlı Discord pp + durum (Lanyard). Kendi sitende barındırınca çalışır; burada sessizce atlanır. */
if(ME.discordId){
  fetch("https://api.lanyard.rest/v1/users/"+ME.discordId).then(r=>r.json()).then(j=>{
    const d=j.data;if(!d)return;const u=d.discord_user;
    const src=u.avatar?`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=256`:"";
    if(src){setAvatar($("avatar"),src,ME.name);setAvatar($("davatar"),src,ME.name)}
    $("dname").textContent=u.global_name||u.username;
    setState(d.discord_status);$("dhandle").textContent=u.username;
  }).catch(()=>{});
}

/* Discord'a tıklayınca kullanıcı adını kopyala */
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2000)};
document.querySelectorAll('a[href*="discord.com/users"]').forEach(a=>a.addEventListener("click",e=>{
  e.preventDefault();
  const done=()=>toast(ME.discordName+" kopyalandı");
  try{navigator.clipboard.writeText(ME.discordName).then(done,()=>toast("Discord: "+ME.discordName))}catch(_){toast("Discord: "+ME.discordName)}
}));
/* GitHub son projeler (kendi sitende barındırınca görünür) */
fetch("https://api.github.com/users/Seyoria/repos?sort=updated&per_page=8").then(r=>r.json()).then(list=>{
  const rs=list.filter(r=>!r.fork).slice(0,3);if(!rs.length)return;
  rs.forEach(r=>$("repos").appendChild(row(ICON.github,r.name,(r.description||"")+(r.stargazers_count?" ★ "+r.stargazers_count:""),r.html_url)));
  $("gh").hidden=false;
}).catch(()=>{});
/* Kar yağışı + aç/kapat düğmesi */
(()=>{const c=$("dust"),btn=$("snowbtn");if(!c)return;const x=c.getContext("2d");let w=0,h=0,on=true;
try{on=localStorage.getItem("snow")!=="off"}catch(e){}
const set=v=>{on=v;btn.setAttribute("aria-pressed",v);try{localStorage.setItem("snow",v?"on":"off")}catch(e){}};set(on);
btn.addEventListener("click",()=>set(!on));
const P=[];for(let i=0;i<130;i++){const z=Math.random();P.push({x:Math.random()*1200,y:Math.random()*800,r:.8+z*2.4,v:.35+z*1,a:.35+z*.55,p:Math.random()*6.28,s:.3+Math.random()*.6})}
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
(function f(t){if(c.width!==innerWidth||c.height!==innerHeight){w=c.width=innerWidth;h=c.height=innerHeight;P.forEach(p=>{if(p.x>w)p.x=Math.random()*w;if(p.y>h)p.y=Math.random()*h})}
x.clearRect(0,0,w,h);if(on){for(const p of P){if(!still){p.y+=p.v;p.x+=Math.sin(t/1800*p.s+p.p)*.35+.1}if(p.y>h+6){p.y=-6;p.x=Math.random()*w}if(p.x>w+6)p.x=-6;x.globalAlpha=p.a;x.fillStyle="#fff";x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}}
requestAnimationFrame(f)})(0)})();
/* İmleci takip eden yumuşak ışık */
addEventListener("pointermove",e=>{$("glow").style.transform="translate("+e.clientX+"px,"+e.clientY+"px)"});

/* Bio yazı efekti */
(()=>{const el=$("bio"),t=ME.bio;if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;el.setAttribute("aria-label",t);el.textContent="";el.classList.add("typing");let i=0;
setTimeout(function k(){el.textContent=t.slice(0,++i);if(i<t.length)setTimeout(k,55);else setTimeout(()=>el.classList.remove("typing"),1800)},1200)})();
